[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regmgr"
version = "1.0"
description = "Simplified wrapper for the Python winreg module."
authors = [
	{ name = "kubinka0505" }
]
dependencies = [
    "pywin32; platform_system == 'Windows'"
]

readme = "ReadMe.md"

license = "GPL-3.0-or-later"
license-files = ["Licen[cs]e.*"]

keywords = [
	"regedit", "registry",
	"windows-registry",
	"registry-editor",
	"editor",
	"reg-edit", "reg"
]

classifiers = [
	"Development Status :: 4 - Beta",

	"Environment :: Console",
	"Environment :: Win32 (MS Windows)",

	"Intended Audience :: Developers",
	"Intended Audience :: End Users/Desktop",
	"Intended Audience :: System Administrators",

	"Natural Language :: English",

	"Operating System :: Microsoft :: Windows",
	"Operating System :: Microsoft :: Windows :: Windows 7",

	"Programming Language :: Python :: 3 :: Only",

	"Topic :: Database :: Front-Ends",
	"Topic :: Security",
	"Topic :: System"
]

requires-python = ">= 3.10"

[project.urls]
Homepage = "https://github.com/kubinka0505/regmgr"
Repository = "https://github.com/kubinka0505/regmgr"
Issues = "https://github.com/kubinka0505/regmgr/issues"
Changelog = "https://github.com/kubinka0505/regmgr/blob/main/docs/ChangeLog.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]